name: CI

on:
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fail if any test is unmarked
        run: |
          set +e
          python3 -m pytest tests/ -m "not unit and not integration and not e2e" --collect-only -q | tee /tmp/unmarked.txt
          status=${PIPESTATUS[0]}
          set -e
          # Empty unmarked set exits 5. Other non-zero codes are collection errors.
          if [ "$status" -ne 0 ] && [ "$status" -ne 5 ]; then
            echo "pytest collection failed with exit $status"
            exit "$status"
          fi
          if grep -E '::' /tmp/unmarked.txt; then
            echo "Every test must have exactly one of: unit, integration, e2e"
            exit 1
          fi

      - name: Run unit tests
        run: python3 -m pytest -m unit -v

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run integration tests
        run: python3 -m pytest -m integration -v

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run e2e tests
        run: python3 -m pytest -m e2e -v

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full suite with coverage
        run: >
          python3 -m pytest tests/
          --cov=src --cov=pipeline --cov=dashboard --cov=services --cov=fantasy
          --cov-report=term
          --cov-report=xml:coverage.xml
          --cov-report=html:htmlcov

      - name: Write coverage summary
        if: ${{ always() && !cancelled() }}
        run: |
          {
            echo "## Coverage"
            echo ""
            echo '```'
            python3 -m coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifacts
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov
          retention-days: 7
          if-no-files-found: warn

  # Ruleset 21254328 still requires this exact check name from ci-smoke.yml.
  # The old smoke job's checks live in the three pyramid jobs; this is a
  # pass-through alias only. Do not add the Coverage job to needs.
  smoke_alias:
    name: Dashboard + pipeline + golden WAR
    if: ${{ always() && !cancelled() }}
    needs: [unit, integration, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Succeed only when the three pyramid jobs succeeded
        run: |
          test "${{ needs.unit.result }}" = success
          test "${{ needs.integration.result }}" = success
          test "${{ needs.e2e.result }}" = success
