name: SportsDataIO auth probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Prove SPORTSDATAIO_API_KEY
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call CurrentSeason
        env:
          SPORTSDATAIO_API_KEY: ${{ secrets.SPORTSDATAIO_API_KEY }}
        run: |
          python3 <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          key = (os.environ.get("SPORTSDATAIO_API_KEY") or "").strip()
          if not key:
              print("SPORTSDATAIO_API_KEY missing")
              sys.exit(1)

          url = "https://api.sportsdata.io/v3/mlb/scores/json/CurrentSeason"
          request = urllib.request.Request(
              url,
              headers={
                  "Ocp-Apim-Subscription-Key": key,
                  "Accept": "application/json",
              },
          )
          status = None
          body = b""
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  status = int(response.status)
                  body = response.read()
          except urllib.error.HTTPError as exc:
              status = int(exc.code)
              body = exc.read() if exc.fp is not None else b""
          except Exception as exc:
              print(f"http_status=error error_type={type(exc).__name__}")
              sys.exit(1)

          print(f"http_status={status}")
          try:
              payload = json.loads(body.decode("utf-8"))
          except (UnicodeDecodeError, json.JSONDecodeError):
              print(f"shape=bytes len={len(body)}")
          else:
              if isinstance(payload, dict):
                  keys = sorted(str(name) for name in payload.keys())
                  print(f"shape=object len={len(payload)} keys={keys}")
              elif isinstance(payload, list):
                  print(f"shape=array len={len(payload)}")
              else:
                  print(f"shape={type(payload).__name__}")

          sys.exit(0 if status is not None and 200 <= status < 300 else 1)
          PY
