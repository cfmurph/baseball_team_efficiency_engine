name: SportsDataIO auth probe

# Manual proof that secrets.SPORTSDATAIO_API_KEY can authenticate.
# Not a PR check — CI / nightly keep soft-failing when the key is absent
# so forks stay green. Run: Actions → SportsDataIO auth probe → Run workflow
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Prove SPORTSDATAIO_API_KEY
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call Teams
        env:
          SPORTSDATAIO_API_KEY: ${{ secrets.SPORTSDATAIO_API_KEY }}
        run: |
          python3 <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          key = (os.environ.get("SPORTSDATAIO_API_KEY") or "").strip()
          if not key:
              print("SPORTSDATAIO_API_KEY missing; skipping probe (soft-fail)")
              sys.exit(0)

          url = "https://api.sportsdata.io/v3/mlb/scores/json/Teams"
          request = urllib.request.Request(
              url,
              headers={
                  "Ocp-Apim-Subscription-Key": key,
                  "Accept": "application/json",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  status = int(response.status)
                  body = response.read()
          except urllib.error.HTTPError as exc:
              # 401/403 and other HTTP failures: status code only, never the body.
              print(f"http_status={int(exc.code)}")
              sys.exit(1)
          except Exception as exc:
              print(f"http_status=error error_type={type(exc).__name__}")
              sys.exit(1)

          print(f"http_status={status}")
          if not (200 <= status < 300):
              sys.exit(1)
          try:
              payload = json.loads(body.decode("utf-8"))
          except (UnicodeDecodeError, json.JSONDecodeError):
              print(f"shape=bytes len={len(body)}")
          else:
              if isinstance(payload, dict):
                  keys = sorted(str(name) for name in payload.keys())
                  print(f"shape=object len={len(payload)} keys={keys}")
              elif isinstance(payload, list):
                  first_keys = []
                  if payload and isinstance(payload[0], dict):
                      first_keys = sorted(str(name) for name in payload[0].keys())
                  extra = f" item_keys={first_keys}" if first_keys else ""
                  print(f"shape=array len={len(payload)}{extra}")
              else:
                  print(f"shape={type(payload).__name__}")
          sys.exit(0)
          PY
