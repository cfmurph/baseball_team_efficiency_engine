name: CI smoke

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Offline pytest + AppTest + WAR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Full unit suite minus @pytest.mark.network. Covers AppTest boot,
      # golden + overlay rWAR, pull_war contracts, and shared-storage fallback.
      # No live Baseball-Reference / Lahman / S3 calls.
      - name: Run offline smoke suite
        run: python3 -m pytest tests/ -m "not network" -v
