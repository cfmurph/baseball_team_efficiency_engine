[pytest]
testpaths = tests
python_files = test_*.py
addopts = --strict-markers
markers =
    unit: Pure functions, mappers, schema, war_source, share.stat_line, config, and metrics helpers (no network, no heavy I/O)
    integration: Warehouse, metrics, storage, fantasy emitter, mlb_stats, sportsdataio, read API, and pipeline contract tests using fixtures or file:// backends
    e2e: Streamlit AppTest (GM nav + fantasy boot), golden WAR fixture spot checks, and fantasy cards path under current/ and runs/{run_id}/
